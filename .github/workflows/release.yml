name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux and Windows build cgo-free on Linux: the BLE transports there
          # (D-Bus / WinRT) are pure Go, and the optional Dilithium-2 PQC path is
          # behind the `pqc` build tag (liboqs), which prebuilt binaries omit.
          - { runner: ubuntu-latest, goos: linux,   goarch: amd64, cgo: "0", experimental: false }
          - { runner: ubuntu-latest, goos: linux,   goarch: arm64, cgo: "0", experimental: false }
          - { runner: ubuntu-latest, goos: windows, goarch: amd64, cgo: "0", experimental: false }
          # macOS BLE uses CoreBluetooth (cgo), so darwin builds on a macOS runner
          # with cgo on. Marked experimental so a macOS build hiccup never blocks
          # the Linux/Windows release.
          - { runner: macos-latest,  goos: darwin,  goarch: arm64, cgo: "1", experimental: true }
          - { runner: macos-latest,  goos: darwin,  goarch: amd64, cgo: "1", experimental: true }

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          EXT=""
          [ "$GOOS" = "windows" ] && EXT=".exe"
          BINARY="akira-cli_${GOOS}_${GOARCH}${EXT}"
          VERSION="${{ github.ref_name }}"
          go build \
            -ldflags "-s -w -X github.com/PenEngineering/akira-cli/cmd.Version=${VERSION}" \
            -o "dist/${BINARY}" .

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: akira-cli_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/

  publish:
    name: Create GitHub Release
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
